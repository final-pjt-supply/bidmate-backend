name: Backend CD

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cd.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "app/**"
      - "alembic/**"
  # PRs are tested by Backend CI. A successful main-branch CI run becomes the
  # deployment event after CD_ENABLED is explicitly switched to "true".
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release the selected main commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-image:
    name: Validate ARM64 container image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check agent repository credential
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          if [[ -z "${AGENT_REPO_TOKEN}" ]]; then
            echo "::error::AGENT_REPO_TOKEN is required to install bidmate-agents."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
          secrets: |
            agent_repo_token=${{ secrets.AGENT_REPO_TOKEN }}
          provenance: false
          sbom: false

  deploy:
    name: Build ARM64 image and deploy private EC2
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm == 'deploy') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.CD_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Resolve deployment commit
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            deploy_sha="${WORKFLOW_RUN_SHA}"
          else
            deploy_sha="${GITHUB_SHA}"
          fi

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment SHA: ${deploy_sha}"
            exit 1
          fi

          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"

      - name: Check deployment configuration
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          for variable_name in \
            AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID AWS_ROLE_ARN; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Repository variable ${variable_name} is required."
              exit 1
            fi
          done

          if [[ -z "${AGENT_REPO_TOKEN}" ]]; then
            echo "::error::AGENT_REPO_TOKEN is required to install bidmate-agents."
            exit 1
          fi

      - name: Checkout deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bidmate-backend-cd

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image
        id: image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${DEPLOY_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing existing immutable image for ${DEPLOY_SHA}."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable ARM64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
          secrets: |
            agent_repo_token=${{ secrets.AGENT_REPO_TOKEN }}
          provenance: mode=max
          sbom: true

      - name: Deploy through SSM Run Command
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"
          script_base64="$(base64 -w 0 deploy/deploy-container.sh)"
          parameters="$(
            jq -cn \
              --arg script "${script_base64}" \
              --arg image "${image_uri}" \
              --arg region "${AWS_REGION}" \
              '{
                commands: [
                  "set -eu",
                  ("printf %s " + $script + " | base64 --decode > /tmp/bidmate-deploy.sh"),
                  "chmod 700 /tmp/bidmate-deploy.sh",
                  ("/tmp/bidmate-deploy.sh " + $image + " " + $region),
                  "rm -f /tmp/bidmate-deploy.sh"
                ]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "BidMate backend ${DEPLOY_SHA}" \
              --parameters "${parameters}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: ${command_id}"

          status="Pending"
          for attempt in $(seq 1 60); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null \
                || true
            )"

            case "${status}" in
              Success | Cancelled | TimedOut | Failed)
                break
                ;;
            esac

            sleep 5
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --output json
          )"

          echo "${invocation}" | jq -r '"Status: " + .Status'
          echo "${invocation}" | jq -r '.StandardOutputContent'
          echo "${invocation}" | jq -r '.StandardErrorContent' >&2

          if [[ "${status}" != "Success" ]]; then
            echo "::error::Deployment failed with SSM status ${status}."
            exit 1
          fi
