name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  S3_BUCKET: ""
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_PORT: "1"
  POSTGRES_DB: "bidding_agent_ci"
  POSTGRES_USER: "bidding_agent_ci"
  POSTGRES_PASSWORD: "ci-only"
  AWS_DEFAULT_REGION: "ap-northeast-2"
  AWS_EC2_METADATA_DISABLED: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Check private agent credential
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          if [[ -z "${AGENT_REPO_TOKEN}" ]]; then
            echo "::error::AGENT_REPO_TOKEN is required (bidmate-ai-agent Contents: Read)."
            exit 1
          fi

      - name: Configure private agent access
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          auth_header="$(
            printf 'x-access-token:%s' "${AGENT_REPO_TOKEN}" | base64 -w 0
          )"
          git config --global \
            http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${auth_header}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement app/requirements.txt

      - name: Remove private repository credential
        if: always()
        shell: bash
        run: |
          git config --global --unset-all \
            http.https://github.com/.extraheader \
            || true

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Import smoke test
        run: |
          python -c "import agents.run"
          python -c "from app.main import app; assert app.title == 'BidMate API'"

      - name: Run tests
        run: python -m pytest -q --maxfail=1

      - name: Validate deployment shell
        run: |
          bash -n deploy/bootstrap-blue-green.sh
          bash -n deploy/deploy-blue-green.sh

  container:
    name: Validate ARM64 image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check private agent credential
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          if [[ -z "${AGENT_REPO_TOKEN}" ]]; then
            echo "::error::AGENT_REPO_TOKEN is required to build the API image."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
          secrets: |
            agent_repo_token=${{ secrets.AGENT_REPO_TOKEN }}
          provenance: false
          sbom: false

      - name: Validate Nginx slot configurations
        shell: bash
        run: |
          for slot in blue green; do
            docker run --rm \
              --volume "${PWD}/deploy/nginx/${slot}.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine nginx -t
          done
