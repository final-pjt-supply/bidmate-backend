name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # CI는 외부 AWS/RDS를 호출하지 않는다. 외부 인프라 통합 테스트는 별도로 실행한다.
      S3_BUCKET: ""
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "1"
      POSTGRES_DB: "bidding_agent_ci"
      AWS_DEFAULT_REGION: "ap-northeast-2"
      AWS_EC2_METADATA_DISABLED: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout backend
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check agent repository credential
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          if [[ -z "${AGENT_REPO_TOKEN}" ]]; then
            echo "::error::AGENT_REPO_TOKEN secret is required (bidmate-ai-agent Contents: Read)."
            exit 1
          fi

      - name: Configure private agent repository access
        shell: bash
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          auth_header="$(
            printf 'x-access-token:%s' "${AGENT_REPO_TOKEN}" | base64 -w 0
          )"
          git config --global \
            http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${auth_header}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Remove private repository credential
        if: always()
        shell: bash
        run: |
          git config --global --unset-all \
            http.https://github.com/.extraheader \
            || true

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Import smoke test
        run: |
          python -c "import agents.run"
          python -c "from app.main import app; assert app.title == 'BidMate API'"

      - name: Run tests
        run: python -m pytest -q -m "not integration" --maxfail=1
